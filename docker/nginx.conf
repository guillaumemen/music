server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Modules ES et Web Worker : type MIME JavaScript obligatoire.
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        image/svg+xml svg;
    }

    # Toujours revalider : une nouvelle image est prise en compte sans vider le cache.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css text/javascript;
}
